name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit tests only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        run: uv tool install rust-just

      - name: Lint
        run: just lint

      - name: Unit tests
        run: just test
